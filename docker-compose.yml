services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - erp_demo_data:/app/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      ERP_AGENT_API: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  erp_demo_data:


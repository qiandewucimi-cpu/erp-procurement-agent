name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: 生成演示样本
        run: python generate_samples.py

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 编译检查
        run: python -m py_compile api.py ui.py mcp_server.py erp_agent/*.py

      - name: 评测集（确定性层，无需模型密钥）
        run: python evals/run_eval.py --offline

      - name: 测试覆盖率
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report --include="erp_agent/*,api.py" -m

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: evals/REPORT.md
